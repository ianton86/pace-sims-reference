# The deposit must stay runnable by someone who has only this repository.
#
# That is the whole point of the check: everything here runs against a simulator
# and against the study's deposited profiles, with no instrument, no vendor
# software and no credentials. If this workflow ever needs one of those, the
# deposit has stopped being self-contained and the claim in the README is no
# longer true.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version the code claims to support and a current one.
        # A deposit that only runs on the author's interpreter is not a deposit.
        python-version: ['3.10', '3.12']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install numpy pytest

      - name: Run the whole suite
        run: pytest -q

      - name: Replay the study, and print what it found
        # Run separately and print it: the replay is the repository's central
        # claim, so its table belongs in the log where a reviewer can read it
        # rather than only in a pass/fail.
        run: python -m replay
